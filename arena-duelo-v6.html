function move(e,dx,dy,s){const d=Math.hypot(dx,dy);if(d<1)return;const k=Math.min(s,d)/d,nx=e.x+dx*k,ny=e.y+dy*k;

function mkB(h,an,dmg,rng,w,pie,heal){B.push({x:h.x,y:h.y,vx:Math.cos(an)*330,vy:Math.sin(an)*330,life:rng/330,dmg,tm:h.tm,w:w||4,pie,heal,src:h,h:new Set()})}
function fireHero(h,dx,dy){const b=BR[h.br],a=Math.atan2(dy,dx);h.fx=Math.cos(a);h.fy=Math.sin(a);

h.am--;snd(380,.08,'square');fireHero(h,dx,dy)}
function deploy(tm,id,x,y){const c=CARDS[id],m=tm?1+.1*D:lm(id);
if(c.spell){const s=c.spell,en=U.filter(o=>o.tm!=tm&&o.hp>0),al=U.filter(o=>o.tm==tm&&o.k!='t'&&o.hp>0);

return}
for(let i=0;i<c.k;i++)U.push({k:'u',tm,x:x+(i-(c.k-1)/2)*16,y:y+(i%2)*8,hp:c.hp*m,mx:c.hp*m,dmg:c.dmg*m,r:c.r,sp:c.sp,cd:c.cd,t:0,e:c.e,z:c.k>2?10:c.hp>1000?20:14,tw:c.tw,fl:c.fl})}
function play(i,x,y){const id=hand[i],c=CARDS[id];if(el[0]<c.c)return;

function superNow(){const h=U.find(o=>o.k=='h'&&o.tm==0);if(!h||sup<100)return;sup=0;snd(600,.3,'sawtooth');addQ('su',1);const b=BR[h.br];

if(b.sup=='ring')for(let i=0;i<12;i++)mkB(h,i/12*6.283,110*m,150);

else{const r=b.sup=='slam'?105:150;FX.push({x:h.x,y:h.y,r,t:.5,col:b.sup=='slam'?'#ffb703':'#6bff95'});
for(const o of U){if(o.hp<=0||Math.hypot(o.x-h.x,o.y-h.y)>r)continue;
if(o.tm==1){hurt(o,b.sup=='slam'?(o.k=='t'?120:350*m):150*m,h);if(b.sup=='slam'&&o.k!='t')o.frz=1.5}

function upd(dt){
time-=dt;if(time<=0){if(!OT&&crowns[0]==crowns[1]){OT=1;time=60;FX.push({x:180,y:260,r:80,t:.6,col:'#ffd23f'});snd(300,.4,'sawtooth')}else{end();return}}
const dbl=D>=3?60:40,rate=((OT||time<dbl||EV.k=='el')?2:1)/1.8;el[0]=Math.min(10,el[0]+dt*rate);el[1]=Math.min(10,el[1]+dt*rate*(1+.06*D));
for(const e of U)if(e.k=='h'){e.hid=inB(e.x,e.y)&&!U.some(o=>o.tm!=e.tm&&o.hp>0&&Math.hypot(o.x-e.x,o.y-e.y)<75)}
ait-=dt;if(ait<=0){ait=Math.max(1,2.6-.3*D)+Math.random()*1.5;

if(ok.length){const id=ok[Math.random()*ok.length|0],c=CARDS[id];

for(let i=0;i<2;i++)if(rsp[i]>0){rsp[i]-=dt;if(rsp[i]<=0)U.push(mkHero(i))}
for(const e of U){if(e.hp<=0)continue;e.t-=dt;if(e.rg>0)e.rg-=dt;if(e.k=='h'){e.lh=(e.lh||0)+dt;if(e.lh>3)e.hp=Math.min(e.mx,e.hp+e.mx*.08*dt)}
if(e.frz>0){e.frz-=dt;continue}
if(e.k=='t'){const t=near(e,e.r,()=>1);if(t&&e.t<=0){atk(e,t);e.t=e.cd}continue}
if(e.k=='h'&&e.tm==0){
if(e.am<3){e.ar+=dt;if(e.ar>=BR[e.br].rl){e.am++;e.ar=0}}

continue}

if(any&&e.hp<e.mx*.3){const k=U.find(o=>o.k=='t'&&o.king&&o.tm==e.tm);if(k)move(e,k.x-e.x,k.y-e.y+(e.tm?40:-40),e.sp*dt)}

const d=Math.hypot(dest.x-e.x,dest.y-e.y),rg=e.r+(dest.z||12);
if(d<=(any?e.r:rg)){if(e.t<=0){if(any){fireHero(e,dest.x-e.x,dest.y-e.y);e.t=BR[e.br].rl}else{atk(e,dest);e.t=e.cd}}}else step(e,dest.x,dest.y,dt)}
for(const a of U){if(a.k=='t')continue;for(const b of U){if(a==b||b.k=='t'||!!a.fl!=!!b.fl)continue;const dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy)||1,m=(a.z+b.z)*.55;if(d<m){const px=a.x,py=a.y;a.x+=dx/d*(m-d)*.3;a.y+=dy/d*(m-d)*.3;if(!a.fl&&bad(a.x,a.y,a)){a.x=px;a.y=py}}}}

if(EV.k=='me'){mt-=dt;if(mt<=0){mt=6+Math.random()*3;M.push({x:40+Math.random()*280,y:60+Math.random()*400,t:1.2})}}
for(const m of M){m.t-=dt;if(m.t<=0){m.dead=1;FX.push({x:m.x,y:m.y,r:45,t:.4,col:'#ff6a1a'});for(const o of U)if(o.hp>0&&Math.hypot(o.x-m.x,o.y-m.y)<45+o.z/2)hurt(o,o.k=='t'?80:200,null)}}M=M.filter(m=>!m.dead);
for(const f of FX)f.t-=dt;FX=FX.filter(f=>f.t>0);
for(const e of U){if(e.hp>0)continue;
if(e.k=='t'){crowns[1-e.tm]++;FX.push({x:e.x,y:e.y,r:50,t:.5,col:'#ffd23f'});if(e.king){end(1-e.tm);return}}
if(e.k=='h'){rsp[e.tm]=6;if(e.tm==1)addQ('hk',1)}}
if(OT&&crowns[0]!=crowns[1]){end(crowns[0]>crowns[1]?0:1);return}U=U.filter(e=>e.hp>0)}
function end(w){if(w==null){const s=[0,1].map(t=>U.filter(o=>o.k=='t'&&o.tm==t).reduce((a,o)=>a+o.hp,0));
w=crowns[0]>crowns[1]?0:crowns[1]>crowns[0]?1:s[0]>s[1]+50?0:s[1]>s[0]+50?1:-1}

S.q={d:new Date().toDateString(),all:0,l:ks.map((k,i)=>{const t=QT[k];return{t:k,n:t[1]+(Math.random()*(t[2]-t[1]+1)|0),p:0,cl:0,r:i==2?'b':'c',v:60+(Math.random()*60|0)}})};save()}
function addQ(t,n){if(!S.q)return;for(const q of S.q.l)if(q.t==t&&!q.cl)q.p=Math.min(q.n,q.p+n)}
const DR=[{c:50},{b:1},{c:100},{b:1},{c:150},{b:2},{c:300,b:1}];
const nst=()=>S.dd===new Date(Date.now()-864e5).toDateString()?((S.st||0)%7)+1:1;
function dayCheck(){const td=new Date().toDateString();if(!S.q||S.q.d!==td)genQ();if(S.dd!==td)mode='daily'}
function bgm(a,b){const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,a);gr.addColorStop(1,b);g.fillStyle=gr;g.fillRect(0,0,W,H)}
function drawDaily(){bgm('#2e5fd0','#14296b');const d=nst();ot('RECOMPENSA DIARIA',W/2,60,24,'#ffd23f');ot('Día '+d+' de 7',W/2,100,18);
DR.forEach((r,i)=>{const x=12+i*48;rr(x,200,44,96,8,i<d-1?'#1b2740':'#2b4f9e',i==d-1?'#ffd23f':'#0a0f1c');
ot(''+(i+1),x+22,216,13);txt(r.c&&r.b?'🪙📦':r.c?'🪙':'📦',x+22,248,r.c&&r.b?15:24);ot(r.c?''+r.c:'x'+r.b,x+22,280,11);if(i<d-1)txt('✅',x+22,248,20)});
ot('Vuelve cada día: ¡no pierdas la racha!',W/2,340,13,'#cfe3ff');btn(70,420,220,70,'COBRAR','#ffc61a',30,'#fff')}

function drawQuests(){bgm('#2e5fd0','#14296b');ot('MISIONES DIARIAS',W/2,26,22,'#ffd23f');
S.q.l.forEach((q,i)=>{const y=56+i*96,t=QT[q.t],done=q.p>=q.n;rr(12,y,336,86,12,q.cl?'#1b2740':'#2b4f9e','#0a0f1c');
txt(t[0].replace('%n',q.n),24,y+22,14,'#fff','left');
rr(24,y+38,200,14,7,'#0a0f1c');rr(25,y+39,Math.max(0,198*q.p/q.n),12,6,done?'#4cd964':'#ffc61a');ot(q.p+'/'+q.n,124,y+45,11);
txt(q.r=='c'?'Premio: '+q.v+' 🪙':'Premio: 1 📦',24,y+70,12,'#cfe3ff','left');
if(q.cl)txt('✅',290,y+44,26);else btn(240,y+22,100,40,done?'Cobrar':'...',done?'#2eb85c':'#555',14)});
ot(S.q.all?'¡Bonus de caja cobrado!':'Completa las 3 y gana una caja 📦',W/2,360,13,'#e0a8ff');
ot(EV.n,W/2,410,12,'#7df9ff');ot('Las misiones se renuevan cada día',W/2,440,12,'#9fb6d3');
btn(80,588,200,40,'Volver','#e63946',18)}
function questsTap(x,y){if(y>580){mode='menu';return}
S.q.l.forEach((q,i)=>{if(inr(x,y,240,56+i*96+22,100,40)&&q.p>=q.n&&!q.cl){q.cl=1;if(q.r=='c')S.co+=q.v;else S.bx++;snd(650,.2,'triangle');
if(S.q.l.every(z=>z.cl)&&!S.q.all){S.q.all=1;S.bx++}save()}})}
let mg,mtimer=null,ms=0,mtr=0,mlast=0,nt=0,LBc=null,LBd=-1,rk=0;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();mg=AC.createGain();mg.gain.value=S.mu===0?0:.5;mg.connect(AC.destination)}catch(e){return null}}return AC}
function startMus(){if(!ac())return;if(AC.state=='suspended')AC.resume();if(!mtimer){nt=AC.currentTime+.1;mtimer=setInterval(sched,50)}}
document.addEventListener('visibilitychange',()=>{if(AC)document.hidden?AC.suspend():AC.resume()});
const fq=n=>220*Math.pow(2,n/12);
function nv(f,t,d,ty,v){const o=AC.createOscillator(),gn=AC.createGain();o.type=ty;o.frequency.value=f;gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(gn);gn.connect(mg);o.start(t);o.stop(t+d+.02)}
function kick(t){const o=AC.createOscillator(),gn=AC.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);gn.gain.setValueAtTime(.18,t);gn.gain.exponentialRampToValueAtTime(.0001,t+.15);o.connect(gn);gn.connect(mg);o.start(t);o.stop(t+.18)}
const RT=[0,-4,3,-2],CHM=[[0,3,7],[-4,0,3],[3,7,10],[-2,2,5]],RB=[0,-2,-4,-5],CHB=[[0,3,7],[-2,2,5],[-4,0,3],[-5,-1,2]],ARM=[0,1,2,1,0,1,2,1],ARB=[0,2,1,2,0,2,1,2];
function sched(){if(!AC||AC.state!='running')return;if(mtr!=mlast){mlast=mtr;ms=0}
const sl=mtr?.15:.28;while(nt<AC.currentTime+.25){if(S.mu!==0){const c=(ms>>3)&3,j=ms&7;
if(mtr){nv(fq(RB[c]-24),nt,.12,'sawtooth',.05);if(j%4==0)kick(nt);if(j&1)nv(9000,nt,.03,'square',.012);nv(fq(CHB[c][ARB[j]]+12),nt,.14,'sawtooth',.022)}
else{if(j%4==0)nv(fq(RT[c]-12),nt,.55,'triangle',.08);nv(fq(CHM[c][ARM[j]]+12),nt,.3,'square',.02)}}
ms=(ms+1)&31;nt+=sl}}
function lvInfo(){let x=S.xp||0,l=1;while(x>=100+50*(l-1)){x-=100+50*(l-1);l++}return{l,x,n:100+50*(l-1)}}
const BN=['Sombra','Lobo_X','Nova','Kira','Tigre','Zeta','Mateo','Luna','Rayo','Fénix','Draco','Aitana','Nico','Ares','Yuki','Bruno','Vega','Titán','Maya','Hielo'];
function lb(){const day=Math.floor(Date.now()/864e5);if(LBd!=day){LBd=day;LBc=[];for(let i=0;i<200;i++){const h=((i*2654435761+day*40503)>>>0)%21;LBc.push({n:BN[i%20]+(10+(i*37)%90),t:Math.max(0,Math.round(1900*Math.pow(.975,i)*(1+(h-10)/150))),b:BK[(i*7+day)%BK.length]})}LBc.sort((a,b)=>b.t-a.t)}return LBc}
function myRank(){return 1+lb().filter(b=>b.t>S.tr).length}
function lobbyTap(x,y){
if(inr(x,y,64,428,232,70))init();
else if(inr(x,y,10,176,52,60))mode='quests';else if(inr(x,y,10,246,52,60))openBox();
else if(inr(x,y,298,176,52,60)){S.mu=S.mu===0?1:0;if(mg)mg.gain.value=S.mu===0?0:.5;save()}
else if(inr(x,y,298,246,52,60)){S.sf=S.sf===0?1:0;save()}
else if(inr(x,y,50,6,120,44)){try{const n=prompt('Tu nombre (máx. 12 letras):',S.name);if(n&&n.trim()){S.name=n.trim().slice(0,12);save()}}catch(e){}}
else if(inr(x,y,12,530,80,62))mode='brawlers';else if(inr(x,y,96,530,80,62))mode='cards';else if(inr(x,y,180,530,80,62)){mode='rank';rk=0}else if(inr(x,y,264,530,80,62))mode='road'}
function drawLobby(){if(Date.now()-S.fb>14400000){S.bx++;S.fb=Date.now();save()}
const t=performance.now(),ca=arenaOf(S.tr),r=AR[ca],nx=AR[ca+1],b=BR[S.sel],li=lvInfo();
bgm('#2e5fd0','#14296b');
g.fillStyle=r.g+'33';g.beginPath();g.arc(180,225,150,0,7);g.fill();
g.fillStyle='#fff';for(let i=0;i<18;i++){const x=(i*53+t*.012*(1+i%3))%W,y=H-((i*97+t*.03*(1+i%3))%H);g.globalAlpha=.25;g.beginPath();g.arc(x,y,1.5+i%3,0,7);g.fill()}g.globalAlpha=1;
g.fillStyle='#ffc61a';g.beginPath();g.arc(30,30,21,0,7);g.fill();g.lineWidth=3;g.strokeStyle='#0a0f1c';g.stroke();ot(''+li.l,30,30,18);
ot(S.name,58,20,14,'#fff','left');rr(58,32,92,9,4,'#0a0f1c');rr(59,33,Math.max(0,90*li.x/li.n),7,3,'#4cd964');
pill(176,10,84,'🏆 '+S.tr);pill(266,10,86,'🪙 '+S.co);
ot(r.n.toUpperCase(),W/2,70,26,'#ffd23f');rr(40,88,280,16,8,'#0a0f1c');
if(nx){rr(42,90,Math.max(0,276*(S.tr-r.t)/(nx.t-r.t)),12,6,'#ffc61a');ot('Próxima arena: '+nx.n+' ('+nx.t+')',W/2,118,12)}else{rr(42,90,276,12,6,'#ffc61a');ot('¡Arena máxima!',W/2,118,12)}
g.fillStyle=r.g;g.beginPath();g.arc(W/2,225,86,0,7);g.fill();g.lineWidth=6;g.strokeStyle='#0a0f1c';g.stroke();
g.fillStyle='#0003';g.beginPath();g.ellipse(W/2,300,46,11,0,0,7);g.fill();txt(b.e,W/2,222+Math.sin(t/400)*6,104);
ot(b.n.toUpperCase(),W/2,334,26);pill(W/2-90,352,85,'🏆 '+(S.bt[S.sel]||0));pill(W/2+5,352,85,'⚡ '+pw(S.sel));
const sb=(x,y,e,l,col)=>{btn(x,y,52,56,'',col,10);txt(e,x+26,y+20,22);ot(l,x+26,y+43,10)};
sb(10,176,'📜','Misiones',S.q&&S.q.l.some(q=>q.p>=q.n&&!q.cl)?'#e63946':'#3d7bff');
sb(10,246,'📦','Cajas '+S.bx,'#b24dff');
sb(298,176,S.mu===0?'🔇':'🎵','Música',S.mu===0?'#555':'#3d7bff');
sb(298,246,S.sf===0?'🔇':'🔊','Sonido',S.sf===0?'#555':'#3d7bff');
ot(EV.n,W/2,410,11,'#ffd23f');
const pl=Math.sin(t/300)*5;btn(64-pl/2,428,232+pl,70,'JUGAR','#ffc61a',34,'#fff');
btn(12,530,80,62,'Brawlers','#3d7bff',12);btn(96,530,80,62,'Cartas','#3d7bff',12);btn(180,530,80,62,'Ranking','#3d7bff',12);btn(264,530,80,62,'Camino','#3d7bff',12)}
function rowR(y,n,e){rr(12,y,336,36,8,e.me?'#ffc61a':'#2b4f9e','#0a0f1c');const med=n==1?'🥇':n==2?'🥈':n==3?'🥉':'',c=e.me?'#0a0f1c':'#fff';
if(med)txt(med,30,y+18,18);else ot('#'+n,30,y+18,13,c);
ot(e.n,52,y+18,14,c,'left');txt(BR[e.b].e,228,y+18,18);ot('🏆 '+e.t,340,y+18,14,e.me?'#0a0f1c':'#ffd23f','right')}
function drawRank(){bgm('#2e5fd0','#14296b');ot('CLASIFICACIÓN',W/2,26,22,'#ffd23f');
['Jugadores','Brawlers','Récords'].forEach((n,i)=>btn(12+i*116,46,108,30,n,i==rk?'#ffc61a':'#3d7bff',13,i==rk?'#0a0f1c':'#fff'));
if(rk==0){const L=lb(),R=myRank(),A=L.slice();A.splice(R-1,0,{n:S.name,t:S.tr,b:S.sel,me:1});
ot('Mejores del mundo',W/2,100,13,'#cfe3ff');for(let i=0;i<6;i++)rowR(112+i*40,i+1,A[i]);
ot('Tu posición: #'+R,W/2,362,13,'#cfe3ff');const s0=Math.max(0,Math.min(A.length-5,R-3));for(let i=0;i<5;i++)rowR(374+i*40,s0+i+1,A[s0+i])}
else if(rk==1){const ids=BK.filter(k=>BR[k].a<=S.maxA).sort((a,b)=>(S.bt[b]||0)-(S.bt[a]||0));ot('Tus brawlers',W/2,100,13,'#cfe3ff');
ids.forEach((id,i)=>{const y=112+i*52,top=lb().find(e=>e.b==id);rr(12,y,336,46,8,'#2b4f9e','#0a0f1c');ot('#'+(i+1),30,y+23,13);txt(BR[id].e,64,y+23,26);
ot(BR[id].n,90,y+14,14,'#fff','left');ot('🏆 '+(S.bt[id]||0)+'  ⚡ '+pw(id),90,y+33,11,'#ffd23f','left');
if(top)txt('Mejor: '+top.n+' 🏆'+top.t,340,y+23,10,'#cfe3ff','right')})}
else{const st=S.stat||{m:0,w:0,tw:0,bs:0,bt:0},rows=[['Nivel',lvInfo().l],['Partidas',st.m],['Victorias',st.w+(st.m?' ('+Math.round(100*st.w/st.m)+'%)':'')],['Torres destruidas',st.tw],['Mejor racha 🔥',st.bs],['Récord de trofeos 🏆',Math.max(st.bt||0,S.tr)],['Arena',AR[arenaOf(S.tr)].n],['Brawlers',BK.filter(k=>BR[k].a<=S.maxA).length+'/'+BK.length],['Cartas',IDS.filter(k=>CARDS[k].a<=S.maxA).length+'/'+IDS.length],['Posición mundial','#'+myRank()]];
rows.forEach((r,i)=>{const y=88+i*46;rr(12,y,336,40,8,'#2b4f9e','#0a0f1c');ot(r[0],24,y+20,14,'#fff','left');ot(''+r[1],336,y+20,15,'#ffd23f','right')})}
txt('Clasificación simulada (sin conexión)',W/2,580,9,'#9fb6d3');btn(80,590,200,38,'Volver','#e63946',18)}
function rankTap(x,y){if(y>584){mode='menu';return}if(y>=46&&y<=76){const i=Math.floor((x-12)/116);if(i>=0&&i<3&&x-12-i*116<108)rk=i}}
function draw(){g.setTransform(sc,0,0,sc,0,0);
if(mode=='play')drawPlay();else if(mode=='menu')drawLobby();else if(mode=='cards')drawCards();else if(mode=='brawlers')drawBrawlers2();else if(mode=='road')drawRoad();else if(mode=='box')drawBox();else if(mode=='quests')drawQuests();else if(mode=='daily')drawDaily();else if(mode=='rank')drawRank();else drawEnd()}
function pt(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/sc,(e.clientY-r.top)/sc]}
function cardsTap(x,y){if(y>578){mode='menu';return}
const col=Math.floor((x-12)/116),row=Math.floor((y-66)/96),lx=x-12-col*116,ly=y-66-row*96;
if(col<0||col>2||row<0||ly<0||lx>108||ly>88)return;const id=IDS[row*3+col];if(!id||CARDS[id].a>S.maxA)return;
if(ly<60){const i=S.deck.indexOf(id);if(i>=0){if(S.deck.length>5)S.deck.splice(i,1)}else if(S.deck.length<8)S.deck.push(id)}
else{const cost=40*lv(id);if(lv(id)<8&&S.co>=cost){S.co-=cost;S.lv[id]=lv(id)+1}}
save()}
cv.addEventListener('pointerdown',e=>{e.preventDefault();startMus();const[x,y]=pt(e);
if(mode=='menu'){lobbyTap(x,y);return}
if(mode=='brawlers'){brawlersTap2(x,y);return}
if(mode=='cards'){cardsTap(x,y);return}
if(mode=='road'){mode='menu';return}
if(mode=='box'){if(boxT>2)mode='menu';return}
if(mode=='quests'){questsTap(x,y);return}
if(mode=='rank'){rankTap(x,y);return}
if(mode=='daily'){dailyTap();return}
if(mode=='end'){if(Date.now()-endAt>500)mode='menu';return}
if(y>AH){if(y>552){const i=Math.floor((x-12)/84);if(i>=0&&i<4&&x-12-i*84<76&&CARDS[hand[i]].c<=el[0])drag={id:e.pointerId,i,x,y}}return}
if(Math.hypot(x-300,y-452)<46){if(!aim)aim={id:e.pointerId,dx:0,dy:0,sx:x,sy:y};return}
if(Math.hypot(x-240,y-482)<28){superNow();return}
if(x<200&&!joy)joy={id:e.pointerId,sx:x,sy:y,dx:0,dy:0}});
cv.addEventListener('pointermove',e=>{const[x,y]=pt(e);
if(joy&&joy.id==e.pointerId){joy.dx=x-joy.sx;joy.dy=y-joy.sy}
if(aim&&aim.id==e.pointerId){aim.dx=x-aim.sx;aim.dy=y-aim.sy}
if(drag&&drag.id==e.pointerId){drag.x=x;drag.y=y}});
const up=e=>{if(joy&&joy.id==e.pointerId)joy=null;
if(aim&&aim.id==e.pointerId){const m=Math.hypot(aim.dx,aim.dy);if(mode=='play')pFire(m<12?0:aim.dx,m<12?0:aim.dy);aim=null}
if(drag&&drag.id==e.pointerId){if(mode=='play'&&drag.y<AH)play(drag.i,drag.x,drag.y);drag=null}};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
let last=performance.now();
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;mtr=mode=='play'?1:0;if(mode=='play')upd(dt);if(mode=='box')boxT+=dt;draw();requestAnimationFrame(loop)}
dayCheck();requestAnimationFrame(loop);
</script></body></html>
